<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Battlegrounds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <h1>3D Arena Battlegrounds</h1>
    <p><b>WASD</b> Move | <b>SPACE</b> Attack | <b>E</b> Ultimate Shockwave</p>
    
    <p id="ult-status">Ultimate (E): READY!</p>

    <label>Player HP</label>
    <div id="hp-container">
      <div id="player-hp-bar"></div>
    </div>

    <label>Enemy HP</label>
    <div id="hp-container">
      <div id="enemy-hp-bar"></div>
    </div>

    <p id="status-text">Target Locked</p>
  </div>

  <!-- Load Three.js FIRST -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <!-- Load Game SECOND -->
  <script src="game.js"></script>
</body>
</html>
